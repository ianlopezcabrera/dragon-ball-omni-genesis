<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprobación de conexión</title><link rel="stylesheet" href="setup.css"><script src="config.js" defer></script><script src="connection.js" defer></script></head><body><main><a href="./">Volver a instalación</a><p class="eyebrow">COMPROBACIÓN PRIVADA</p><h1>Servicio de cuentas</h1><p>Utiliza cuentas de prueba. Los módulos del rol todavía no están conectados a este servicio.</p><section><h2>Estado de conexión</h2><label for="api">Dirección del servicio</label><input id="api" type="url" placeholder="http://127.0.0.1:8787"><button id="health" class="secondary" style="margin-top:12px">Comprobar conexión</button><p class="status" id="status" role="status">Sin comprobar.</p></section><section id="auth"><h2>Cuenta de prueba</h2><form id="login"><label>Usuario</label><input name="username" required autocomplete="username"><label>Contraseña</label><input name="password" type="password" required autocomplete="current-password"><label>Código de invitación (solo registro)</label><input name="code" autocomplete="off"><div class="row"><button type="submit" value="login">Iniciar sesión</button><button class="secondary" type="submit" value="register">Registrar cuenta</button></div></form></section><section id="account" hidden><h2 id="who"></h2><div class="row"><button id="logout">Cerrar sesión</button><button class="secondary" id="presence">Registrar presencia</button></div><form id="password"><h3>Cambiar contraseña</h3><label>Contraseña actual</label><input name="old" type="password" required><label>Nueva contraseña</label><input name="password" type="password" required><button>Guardar contraseña</button></form></section><section id="management" hidden><h2>Usuarios</h2><button class="secondary" id="list">Actualizar lista</button><div id="users"></div><form id="reset" hidden><h3>Contraseña temporal</h3><label>Cuenta</label><select name="id" id="target"></select><label>Motivo</label><input name="reason" required><button>Generar contraseña temporal</button></form><p id="temporary" class="status" hidden></p></section></main></body></html>
